import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
import org.hidetake.gradle.swagger.generator.GenerateSwaggerUI

buildscript {
    configurations.all {
        resolutionStrategy {
            force("org.springframework.boot:spring-boot-jackson2:4.0.5")
        }
    }
}

plugins {
    //spring
    id 'org.springframework.boot' version '4.1.0'

    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'com.google.devtools.ksp' version '2.3.7'
    //kotlin
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21'
    id 'jacoco'

    id 'com.epages.restdocs-api-spec' version '0.20.0'
    id "org.asciidoctor.jvm.convert" version "4.0.2"
    id 'org.hidetake.swagger.generator' version '2.19.2'
}

group = 'com.kdongsu5509'
version = '0.0.1-SNAPSHOT'
description = 'ImHere Integrated Project'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

asciidoctorj {
    version = "3.0.0"
}

configurations {
    asciidoctorExt
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:4.1.0")
    ksp platform("org.springframework.boot:spring-boot-dependencies:4.1.0")
    implementation platform("org.springframework.modulith:spring-modulith-bom:2.1.0")
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    // KOTLIN
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation "org.springframework.boot:spring-boot-starter-validation"

    //Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    //Tracing
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

    // DB & EXTERNAL
    implementation 'com.mysql:mysql-connector-j'
    developmentOnly 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'
    implementation 'com.google.firebase:firebase-admin:9.8.0'
    implementation 'com.solapi:sdk:1.1.0'

    // QUERY DSL (KSP 환경)
    implementation("io.github.openfeign.querydsl:querydsl-jpa:7.4.0")
    ksp("io.github.openfeign.querydsl:querydsl-ksp-codegen:7.4.0")

    //Spring Modulith
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

    implementation 'org.springframework.retry:spring-retry:2.0.6'
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver'

    // TEST (Spring BOM 적용)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'com.h2database:h2'
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.2.1"

    // TEST Docs
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.0'
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    swaggerUI 'org.webjars:swagger-ui:5.32.6'
    runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
    runtimeOnly 'org.springframework.modulith:spring-modulith-observability'
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = JVM_25
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
    sourceSets {
        main.kotlin.srcDirs += 'build/generated/ksp/main/kotlin'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

ext {
    snippetsDir = file('build/generated-snippets')
}

test {
    useJUnitPlatform()
    outputs.dir snippetsDir
}

asciidoctor {
    inputs.dir snippetsDir
    configurations 'asciidoctorExt'
    dependsOn test
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

openapi3 {
    setServer("https://imhere.ratiko.co.kr")
    title = "ImHere API 문서"
    description = "ImHere 통합 API 문서"
    version = "1.0.0"
    format = "yaml"
    outputDirectory = file("build/api-spec")
}

swaggerSources {
    wedding {
        inputFile = file("build/api-spec/openapi3.yaml")
    }
}

tasks.withType(GenerateSwaggerUI).configureEach {
    dependsOn "openapi3", "verifyOpenApi"
}

tasks.configureEach { task ->
    if (task.name == "openapi3") {
        task.dependsOn "test"
    }
}

// KSP 2.3.x may access its symbol cache before creating it on a clean
// Windows/Gradle 9.3 build.
tasks.matching { it.name in ["kspKotlin", "kspTestKotlin"] }.configureEach {
    doFirst {
        file("${layout.buildDirectory.get().asFile}/kspCaches/${name == 'kspTestKotlin' ? 'test' : 'main'}/symbols").mkdirs()
    }
}

tasks.register('copySwaggerUI', Copy) {
    dependsOn 'generateSwaggerUIWedding'
    from layout.buildDirectory.dir('swagger-ui-wedding')
    into layout.buildDirectory.dir('generated-swagger-resources/static/swagger-ui')
}

/**
 * REST Docs is the source of truth for the OpenAPI document.  Never invent a
 * placeholder operation: an undocumented controller mapping must fail the
 * build so the integration test can be completed instead.
 */
tasks.register("verifyOpenApi") {
    dependsOn "openapi3"
    doLast {
        def specFile = file("build/api-spec/openapi3.yaml")
        def spec = specFile.getText("UTF-8").replace("\r\n", "\n")
        def endpoints = [:]

        fileTree("src/main/kotlin") {
            include "**/*Controller.kt"
            exclude "**/*PageController.kt"
        }.files.each { controllerFile ->
            def source = controllerFile.getText("UTF-8")
            def classMapping = (source =~ /@RequestMapping\(\s*"([^"]+)"[^)]*\)/)
            if (!classMapping.find()) return
            def basePath = classMapping.group(1)
            if (!basePath.startsWith("/api/")) return

            def mappings = source =~ /@(Get|Post|Put|Patch|Delete)Mapping(?:\(([^)]*)\))?/
            mappings.each { match ->
                def httpMethod = match[1].toLowerCase()
                def arguments = match[2] ?: ""
                def paths = []
                if (arguments.trim().isEmpty()) {
                    paths << ""
                } else if (!arguments.contains("params")) {
                    def pathMatches = arguments =~ /"(\/[^\"]*)"/
                    pathMatches.each { pathMatch -> paths << pathMatch[1] }
                } else {
                    // A params-only mapping shares the same OpenAPI path/method.
                    paths << ""
                }

                paths.each { methodPath ->
                    def path = (basePath + (methodPath ?: "")).replaceAll("//+", "/")
                    endpoints["${httpMethod} ${path}"] = [method: httpMethod, path: path]
                }
            }
        }

        def missing = endpoints.values().findAll { endpoint ->
            !(spec =~ /(?m)^  ${java.util.regex.Pattern.quote(endpoint.path)}:\n/).find() ||
                !(spec =~ /(?ms)^  ${java.util.regex.Pattern.quote(endpoint.path)}:\n.*?(?=^  \/|^components:)/).find { block ->
                    block =~ /(?m)^    ${endpoint.method}:\n/
                }
        }

        if (!missing.isEmpty()) {
            throw new GradleException(
                "Undocumented API operations: " + missing.collect { "${it.method.toUpperCase()} ${it.path}" }.sort().join(", ")
            )
        }

        def domainForPath = { path ->
            if (path.startsWith("/api/auth")) return "Auth"
            if (path.startsWith("/api/terms")) return "Terms"
            if (path.startsWith("/api/agreements")) return "Agreements"
            if (path.startsWith("/api/maps")) return "Maps"
            if (path.startsWith("/api/notifications") || path.startsWith("/api/admin/failed-notifications")) return "Notifications"
            if (path.startsWith("/api/friends") || path.startsWith("/api/friendships") || path.contains("/friend-")) return "Friends"
            if (path.startsWith("/api/users") || path.contains("/admin/users")) return "Users"
            return "Other"
        }

        def normalizedSpec = spec.replaceAll("(?m)^      security:\n        - bearerAuth: \\[\\]\\n", "")
        def lines = normalizedSpec.readLines()
        def currentPath = null
        def tagged = []
        lines.each { line ->
            def pathMatch = line =~ /^  (\/api\/[^:]+):$/
            if (pathMatch.find()) currentPath = pathMatch.group(1)
            if (line == "      - api" && currentPath != null) {
                tagged << "      - ${domainForPath(currentPath)}"
            } else {
                tagged << line
            }
            if (line ==~ /^      operationId:.*$/ && currentPath != null &&
                    currentPath.startsWith("/api/") &&
                    !currentPath.startsWith("/api/auth")) {
                tagged << "      security:"
                tagged << "        - bearerAuth: []"
            }
        }
        def tagDefinitions = """tags:
- name: Auth
- name: Users
- name: Friends
- name: Terms
- name: Agreements
- name: Notifications
- name: Maps
- name: Other
"""
        def taggedSpec = tagged.join("\n")
        taggedSpec = taggedSpec.replaceFirst(/(?m)^tags: \[\]\n/, tagDefinitions)
        taggedSpec = taggedSpec.replaceFirst(/(?m)^components:\n/, """components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
""")
        if (!taggedSpec.contains("components:\n")) {
            taggedSpec += """\ncomponents:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
"""
        }
        specFile.write(taggedSpec + "\n", "UTF-8")
        logger.lifecycle("Verified OpenAPI coverage for ${endpoints.size()} controller operations")
    }
}

tasks.named('bootJar') {
    dependsOn 'generateSwaggerUIWedding'
    from(layout.buildDirectory.dir('swagger-ui-wedding')) {
        into 'static/swagger-ui'
    }
    from("build/api-spec") {
        into "static/docs"
    }
}

tasks.named('bootRun') {
    dependsOn 'copySwaggerUI'
    classpath = sourceSets.main.runtimeClasspath + files(
            layout.buildDirectory.dir('generated-swagger-resources')
    )
}


tasks.named('test') {
    useJUnitPlatform()
    jvmArgs("-XX:+EnableDynamicAgentLoading")
    outputs.dir snippetsDir
    finalizedBy 'jacocoTestReport'
}

tasks.named("asciidoctor") {
    inputs.dir snippetsDir
    configurations 'asciidoctorExt'
    dependsOn test
}

jacoco {
    toolVersion = "0.8.15"
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required = false
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/support/**",
                    "**/dto/**",
                    "**/*Request*",
                    "**/*Response*",
                    "**/*Command*",
                    "**/config/**",
                    "**/exception/**",
                    "**/common/**",
                    "**/*JpaEntity*",
                    "**/Q*",
                    "**/*Application*",
                    "**/*BaseEntity*",
                    "**/*BaseTimeEntity*",
                    // Spring 설정 클래스와 프로퍼티 바인딩 홀더.
                    // @Bean 메서드는 컨텍스트 기동만으로 "실행"되어 커버리지를 부풀리고,
                    // 프로퍼티 홀더의 중첩 data class는 equals/hashCode/copy 같은 생성 멤버뿐이라 검증 대상이 아니다.
                    // 로직을 가진 바깥 클래스(SecurityWhiteList, OIDCProperties)는 그대로 집계한다.
                    "**/*Config.class",
                    '**/*Config$*.class',
                    '**/*Properties$*.class'
            ])
        }))
    }
}
