events {
    worker_connections 1024;
}

http {
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;

    log_format main escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"client.address":"$remote_addr",'
        '"http.request.method":"$request_method",'
        '"url.path":"$uri",'
        '"url.query":"$args",'
        '"http.response.status_code":$status,'
        '"http.response.body.size":$body_bytes_sent,'
        '"http.request.duration":$request_time,'
        '"http.request.protocol":"$server_protocol",'
        '"user_agent.original":"$http_user_agent",'
        '"http.request.header.referer":"$http_referer",'
        '"server.address":"$host"'
        '}';

    access_log /var/log/nginx/access.log main;

    # 정상 사용자 1인의 순간 최대 8건과 공유 IP 5명을 고려해 burst 30으로 둔다.
    # 여러 IP로 분산하는 어뷰징은 Nginx IP 제한의 범위 밖이며 애플리케이션에서 다룬다.
    limit_req_zone $binary_remote_addr zone=per_ip_api:10m rate=10r/s;
    limit_req_zone $host zone=global_api:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    limit_req_status 429;
    limit_conn_status 503;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    server {
        listen 80;
        server_name _;

        limit_req zone=per_ip_api burst=30 nodelay;
        limit_req zone=global_api burst=100 nodelay;
        limit_conn per_ip_conn 20;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location / {
            proxy_pass http://iamhere-server-container:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/loadtest/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/loadtest/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        limit_req zone=per_ip_api burst=30 nodelay;
        limit_req zone=global_api burst=100 nodelay;
        limit_conn per_ip_conn 20;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location / {
            proxy_pass http://iamhere-server-container:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
