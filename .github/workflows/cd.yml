name: IMHERE_GITHUB_ACTION_CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "IMHERE_GITHUB_ACTION_CI" ]
    branches:
      - main
    types:
      - completed

jobs:
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Generate image tag
        id: tag
        run: |
          DATE=$(TZ='Asia/Seoul' date +'%Y%m%d-%H%M')
          SHORT_SHA=$(echo "$SOURCE_SHA" | cut -c1-7)
          echo "tag=${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "corretto"

      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew test
          ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  resolve-infra:
    name: Resolve Infra Outputs
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write
      contents: read

    outputs:
      ec2_host: ${{ steps.resolve.outputs.ec2_host }}
      security_group_id: ${{ steps.resolve.outputs.security_group_id }}
      instance_id: ${{ steps.resolve.outputs.instance_id }}
      ecr_repository_name: ${{ steps.resolve.outputs.ecr_repository_name }}

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      STACK_NAME: imhere-prod-infra

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: imhere-github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read CloudFormation outputs
        id: resolve
        run: |
          EC2_HOST=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='ElasticIp'].OutputValue | [0]" --output text)
          SECURITY_GROUP_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='SecurityGroupId'].OutputValue | [0]" --output text)
          INSTANCE_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='Ec2InstanceId'].OutputValue | [0]" --output text)
          ECR_REPOSITORY_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryName'].OutputValue | [0]" --output text)
          ECR_REPOSITORY_URI=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue | [0]" --output text)

          for value in "$EC2_HOST" "$SECURITY_GROUP_ID" "$INSTANCE_ID" "$ECR_REPOSITORY_NAME" "$ECR_REPOSITORY_URI"; do
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "Required CloudFormation output is empty."
              exit 1
            fi
          done

          echo "ec2_host=$EC2_HOST" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$SECURITY_GROUP_ID" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_name=$ECR_REPOSITORY_NAME" >> "$GITHUB_OUTPUT"

  docker-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ build-jar, resolve-infra ]

    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: build/libs/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: imhere-github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate Docker image tags
        run: |
          test -n "${ECR_REPOSITORY_URI}"
          test -n "${IMAGE_TAG}"
          echo "Image tag: ${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "Latest tag: ${ECR_REPOSITORY_URI}:latest"
        env:
          ECR_REPOSITORY_URI: ${{ steps.login-ecr.outputs.registry }}/${{ needs.resolve-infra.outputs.ecr_repository_name }}
          IMAGE_TAG: ${{ needs.build-jar.outputs.tag }}

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ needs.resolve-infra.outputs.ecr_repository_name }}:${{ needs.build-jar.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ needs.resolve-infra.outputs.ecr_repository_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-config:
    name: Sync Config
    runs-on: ubuntu-latest
    needs: [ resolve-infra ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare runtime files from config repo
        run: |
          chmod +x ./infra/scripts/sync-config.sh
          CONFIG_REPO_PAT="$CONFIG_REPO_PAT" \
            ./infra/scripts/sync-config.sh --output-dir /tmp/imhere-secrets
        env:
          CONFIG_REPO_PAT: ${{ secrets.CONFIG_REPO_PAT }}

      - name: Upload runtime files artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-files
          path: /tmp/imhere-secrets/
          retention-days: 1

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [ docker-push, resolve-infra, sync-config ]

    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
      EC2_HOST: ${{ needs.resolve-infra.outputs.ec2_host }}
      ECR_REPOSITORY: ${{ needs.resolve-infra.outputs.ecr_repository_name }}
      EC2_SECURITY_GROUP_ID: ${{ needs.resolve-infra.outputs.security_group_id }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: imhere-github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get GitHub Actions runner public IP
        id: ip
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"

      - name: Add runner IP to EC2 security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.runner_ip }}/32 || true

      - name: Open port 80 for Let's Encrypt HTTP-01 challenge
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 80 \
            --cidr 0.0.0.0/0 || true

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Resolve remote deploy path
        run: |
          REMOTE_DEPLOY_PATH=$(ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
            "EC2_DEPLOY_PATH='${EC2_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -eu
          case "$EC2_DEPLOY_PATH" in
            "~") EC2_DEPLOY_PATH="$HOME" ;;
            "~/"*) EC2_DEPLOY_PATH="$HOME/${EC2_DEPLOY_PATH#~/}" ;;
          esac
          printf '%s' "$EC2_DEPLOY_PATH"
          REMOTE
          )

          case "$REMOTE_DEPLOY_PATH" in
            /*) ;;
            *)
              echo "EC2_DEPLOY_PATH must resolve to an absolute path: $REMOTE_DEPLOY_PATH" >&2
              exit 1
              ;;
          esac

          echo "EC2_DEPLOY_PATH=$REMOTE_DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Provision EC2 host
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
            "EC2_DEPLOY_PATH='${EC2_DEPLOY_PATH}' bash -s" \
            < infra/scripts/remote-provision.sh

      - name: Derive ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Download runtime files artifact
        uses: actions/download-artifact@v7
        with:
          name: runtime-files
          path: /tmp/imhere-secrets

      - name: Render and copy runtime files to EC2
        run: |
          set -e
          # 템플릿 렌더링에 필요한 값(SERVER_NAME 등)이 어느 파일에 있는지 몰라도
          # 되도록 env/*.env를 전부 읽는다.
          set -a
          for env_file in /tmp/imhere-secrets/env/*.env; do
            . "$env_file"
          done
          set +a

          RUNTIME_DIR=/tmp/imhere-runtime
          mkdir -p "$RUNTIME_DIR/infra/nginx" "$RUNTIME_DIR/infra/alloy" "$RUNTIME_DIR/env"
          cp /tmp/imhere-secrets/env/*.env "$RUNTIME_DIR/env/"
          python3 - <<'PY'
          from pathlib import Path
          import os

          runtime_dir = Path('/tmp/imhere-runtime')
          templates = {
              'infra/nginx/nginx.conf.template': 'infra/nginx/nginx.conf',
              'infra/alloy/alloy-config.alloy.template': 'infra/alloy/alloy-config.alloy',
          }

          for source, target in templates.items():
              text = Path(source).read_text(encoding='utf-8')
              for key in ('SERVER_NAME', 'CERT_DOMAIN', 'NGINX_ALLOWED_ORIGIN', 'MGMT_BASE_PATH'):
                  value = os.environ.get(key)
                  if not value:
                      raise SystemExit(f'{key} is required to render {source}')
                  text = text.replace('${' + key + '}', value)

              output = runtime_dir / target
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(text, encoding='utf-8')
          PY

          # 지난 배포에서 남은 env/*.env와 Firebase 키를 먼저 지운다. config repo에서
          # 파일이 사라진 경우 EC2에 유령 파일이 남아 계속 주입되는 걸 막는다.
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
            "rm -f ${EC2_DEPLOY_PATH}/env/*.env ${EC2_DEPLOY_PATH}/secrets/imhereFirebaseKey.json"

          scp -i ~/.ssh/deploy_key docker-compose.yml "${{ secrets.EC2_USER }}@${EC2_HOST}:${EC2_DEPLOY_PATH}/"
          scp -i ~/.ssh/deploy_key /tmp/imhere-runtime/env/*.env "${{ secrets.EC2_USER }}@${EC2_HOST}:${EC2_DEPLOY_PATH}/env/"
          scp -i ~/.ssh/deploy_key /tmp/imhere-runtime/infra/nginx/nginx.conf "${{ secrets.EC2_USER }}@${EC2_HOST}:${EC2_DEPLOY_PATH}/infra/nginx/nginx.conf"
          scp -i ~/.ssh/deploy_key /tmp/imhere-runtime/infra/alloy/alloy-config.alloy "${{ secrets.EC2_USER }}@${EC2_HOST}:${EC2_DEPLOY_PATH}/infra/alloy/alloy-config.alloy"
          scp -i ~/.ssh/deploy_key /tmp/imhere-secrets/secrets/imhereFirebaseKey.json "${{ secrets.EC2_USER }}@${EC2_HOST}:${EC2_DEPLOY_PATH}/secrets/"

      - name: Copy remote deploy scripts to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/scripts/remote-tls.sh \
            infra/scripts/remote-rollout.sh \
            infra/scripts/remote-healthcheck.sh \
            "${{ secrets.EC2_USER }}@${EC2_HOST}:${EC2_DEPLOY_PATH}/infra/scripts/"

      # TLS는 컨테이너 기동을 사이에 두고 두 번 나뉜다.
      # bootstrap: nginx가 참조할 인증서 파일을 보장한다 (없으면 nginx -t부터 실패).
      # issue:     HTTP-01 webroot 검증이라 nginx가 떠서 챌린지를 서빙한 뒤여야 한다.
      - name: Ensure bootstrap TLS certificate
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
            "EC2_DEPLOY_PATH='${EC2_DEPLOY_PATH}' bash ${EC2_DEPLOY_PATH}/infra/scripts/remote-tls.sh bootstrap"

      - name: Roll out containers
        run: |
          # ECR 비밀번호는 stdin으로만 흘린다. GITHUB_ENV나 커맨드라인에 실으면
          # 러너 환경파일과 EC2의 /proc 양쪽에 평문으로 남는다.
          aws ecr get-login-password --region "$AWS_REGION" \
            | ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
              "EC2_DEPLOY_PATH='${EC2_DEPLOY_PATH}' ECR_REGISTRY='${ECR_REGISTRY}' ECR_REPOSITORY='${ECR_REPOSITORY}' bash ${EC2_DEPLOY_PATH}/infra/scripts/remote-rollout.sh"

      - name: Issue or renew Let's Encrypt certificate
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
            "EC2_DEPLOY_PATH='${EC2_DEPLOY_PATH}' bash ${EC2_DEPLOY_PATH}/infra/scripts/remote-tls.sh issue"

      - name: Verify app health
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
            "EC2_DEPLOY_PATH='${EC2_DEPLOY_PATH}' bash ${EC2_DEPLOY_PATH}/infra/scripts/remote-healthcheck.sh"

      # 헬스체크를 통과한 뒤에만 정리한다. 앞에서 prune 하면 직전 :latest가
      # dangling으로 지워져 수동 롤백 대상 이미지가 사라진다.
      - name: Prune dangling images
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${EC2_HOST}" \
            "sudo docker image prune -f"

      - name: Remove runner IP from EC2 security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.runner_ip }}/32 || true

      - name: Close port 80 opened for Let's Encrypt
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 80 \
            --cidr 0.0.0.0/0 || true

      - name: Cleanup runner temp files
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -rf /tmp/imhere-secrets
          rm -rf /tmp/imhere-runtime
