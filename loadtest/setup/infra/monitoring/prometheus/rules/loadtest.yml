groups:
  - name: imhere-loadtest
    interval: 5s
    rules:
      - record: imhere:http_requests_per_second
        expr: sum(rate(http_server_requests_seconds_count[30s]))

      - record: imhere:http_5xx_per_second
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[30s]))

      - record: imhere:http_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[30s])))

      - record: imhere:hikaricp_pending
        expr: max(hikaricp_connections_pending)
