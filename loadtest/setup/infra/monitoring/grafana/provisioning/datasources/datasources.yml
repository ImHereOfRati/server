apiVersion: 1

datasources:
  - name: grafanacloud-prom
    uid: loadtest-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: grafanacloud-logs
    uid: loadtest-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: grafanacloud-traces
    uid: loadtest-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
