<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>실패 알림</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<header th:replace="~{admin/fragments :: header('notifications')}"></header><main class="admin-main"><div class="page-heading"><div><div class="eyebrow">ADMIN · NOTIFICATIONS</div><h1>실패 알림</h1></div><form method="post" action="/admin/failed-notifications/redeliver"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="primary-button" type="submit">전체 재발송</button></form></div><section class="list-card"><div th:if="${notifications.empty}" class="empty-state">실패한 알림이 없습니다.</div><article class="list-row" th:each="notification : ${notifications}"><div><strong th:text="${notification.title}">알림</strong><span th:text="${notification.targetIdentifier}">수신자</span><small th:text="${notification.lastError}">오류</small></div><div class="actions"><form method="post" th:action="@{'/admin/failed-notifications/' + ${notification.id} + '/redeliver'}"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button type="submit">재발송</button></form><form method="post" th:action="@{'/admin/failed-notifications/' + ${notification.id} + '/discard'}"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button type="submit">폐기</button></form></div></article></section></main><footer th:replace="~{admin/fragments :: footer}"></footer></body></html>
