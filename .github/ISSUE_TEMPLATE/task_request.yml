name: 작업 (Task)
description: 문서, 테스트, 리팩터링, 설정 등 제품 기능 외 작업을 요청합니다.
title: "[Task] "
labels:
  - task
assignees:
  - kdongsu5509
body:
  - type: markdown
    attributes:
      value: |
        작업에 필요하지 않은 배경이나 방법은 생략해도 됩니다. 완료 조건은 반드시 확인 가능한 결과로 작성해 주세요.

  - type: dropdown
    id: task-type
    attributes:
      label: 작업 유형
      options:
        - 문서
        - 테스트
        - 리팩터링
        - 빌드 또는 배포
        - 설정 또는 의존성
        - 유지보수
        - 기타
    validations:
      required: true

  - type: dropdown
    id: scopes
    attributes:
      label: 영향 영역
      description: 작업이 영향을 주는 영역을 모두 선택해 주세요.
      multiple: true
      options:
        - API
        - 도메인 로직
        - 데이터베이스 또는 마이그레이션
        - 외부 연동
        - 인프라 또는 배포
        - 영역 공통 또는 무관
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 어디에서 무엇을 변경해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경과 목적
      description: 작업이 필요한 이유나 선행 맥락이 있을 때만 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: approach
    attributes:
      label: 제안하는 방법
      description: 선호하는 접근 방법이나 제약이 있을 때만 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: completion-criteria
    attributes:
      label: 완료 조건
      description: 작업이 끝났다고 판단할 수 있는 확인 가능한 결과를 작성해 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 자료
      description: 관련 이슈, PR, 문서가 있다면 연결해 주세요.
    validations:
      required: false
