worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  error_log /var/log/nginx/error.log warn;
  sendfile on;
  keepalive_timeout 65;

  log_format main escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"client.address":"$remote_addr",'
    '"http.request.method":"$request_method",'
    '"url.path":"$uri",'
    '"url.query":"$args",'
    '"http.response.status_code":$status,'
    '"http.response.body.size":$body_bytes_sent,'
    '"http.request.duration":$request_time,'
    '"nginx.upstream.status":"$upstream_status",'
    '"nginx.upstream.response_time":"$upstream_response_time",'
    '"nginx.upstream.connect_time":"$upstream_connect_time",'
    '"http.request.protocol":"$server_protocol",'
    '"user_agent.original":"$http_user_agent",'
    '"http.request.header.referer":"$http_referer",'
    '"server.address":"$host"'
    '}';

  access_log /var/log/nginx/access.log main;

  limit_req_zone $binary_remote_addr zone=per_ip_api:10m rate=10r/s;
  limit_req_zone $host zone=global_api:10m rate=100r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
  limit_req_status 429;
  limit_conn_status 503;
  client_max_body_size 1m;
  large_client_header_buffers 4 16k;

  server {
    listen 80;
    server_name _;
    limit_req zone=per_ip_api burst=30 nodelay;
    limit_req zone=global_api burst=100 nodelay;
    limit_conn per_ip_conn 20;
    location / {
      proxy_pass http://iamhere-server-container:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }
  }
}
