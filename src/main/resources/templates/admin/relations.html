<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관계 관리</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<header th:replace="~{admin/fragments :: header('relations')}"></header><main class="admin-main"><div class="page-heading"><div><div class="eyebrow">ADMIN · RELATIONS</div><h1 th:text="${kind == 'requests' ? '친구 요청' : kind == 'friendships' ? '친구 관계' : '친구 제한'}">관계</h1></div></div><div class="tabs"><a href="/admin/relations/requests">요청</a><a href="/admin/relations/friendships">관계</a><a href="/admin/relations/restrictions">제한</a></div>
<section class="list-card"><div th:if="${items.empty}" class="empty-state">표시할 항목이 없습니다.</div><article class="list-row" th:each="item : ${items}"><div><strong th:text="${item}">관계 항목</strong></div><form method="post" th:action="@{'/admin/relations/' + ${kind} + '/' + ${item.id} + '/delete'}"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button type="submit">삭제</button></form></article></section></main><footer th:replace="~{admin/fragments :: footer}"></footer></body></html>
