services:
  dsko:
    # cd.yml이 ECR에 push한 이미지와 태그를 사용한다.
    # IMAGE_TAG를 생략하면 cd.yml이 항상 갱신하는 latest를 pull한다.
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/${ECR_REPOSITORY:?ECR_REPOSITORY is required}:${IMAGE_TAG:-latest}
    pull_policy: always
  alloy:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./loadtest/setup/infra/monitoring/alloy-config.loadtest.alloy:/etc/alloy/config.alloy:ro
