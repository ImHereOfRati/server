name: 버그 (Bug)
description: 기대한 동작과 다른 문제를 보고합니다.
title: "[Bug] "
labels:
  - fix
assignees:
  - kdongsu5509
body:
  - type: markdown
    attributes:
      value: |
        필요한 내용만 작성해 주세요. 원인을 모르더라도 실제 결과와 재현 방법이 분명하면 충분합니다.

  - type: dropdown
    id: scopes
    attributes:
      label: 영향 영역
      description: 문제가 발생한 영역을 모두 선택해 주세요.
      multiple: true
      options:
        - API
        - 도메인 로직
        - 데이터베이스 또는 마이그레이션
        - 외부 연동
        - 인프라 또는 배포
        - 영역 공통 또는 무관
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 실제 결과
      description: 무엇이 잘못되었는지 관찰한 결과를 작성해 주세요.
      placeholder: 현재 어떤 현상이 발생하나요?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 기대 결과
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
      placeholder: 기대한 동작이나 응답은 무엇인가요?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 다른 사람이 같은 문제를 확인할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      description: 해당하는 정보만 작성해 주세요.
      placeholder: |
        - 배포 환경 또는 브랜치:
        - 서버 또는 이미지 버전:
        - 요청 엔드포인트와 파라미터:
        - 발생 시점 또는 빈도:
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 증거 자료
      description: 로그, 스택 트레이스, 응답 본문, 스크린샷 또는 관련 링크가 있다면 첨부해 주세요.
    validations:
      required: false

  - type: textarea
    id: suspected-cause
    attributes:
      label: 원인 추정
      description: 짐작되는 원인이 있을 때만 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: completion-criteria
    attributes:
      label: 완료 조건
      description: 이 문제가 해결되었다고 판단할 수 있는 확인 가능한 결과를 작성해 주세요.
      placeholder: |
        - [ ] 동일한 방법으로 문제가 재현되지 않는다.
        - [ ] 관련 회귀 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 자료
      description: 관련 이슈, PR, 문서가 있다면 연결해 주세요.
    validations:
      required: false
