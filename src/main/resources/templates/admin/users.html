<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>사용자 관리</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<header th:replace="~{admin/fragments :: header('users')}"></header><main class="admin-main"><div class="page-heading"><div><div class="eyebrow">ADMIN · USERS</div><h1>사용자 관리</h1><p class="muted">계정 상태를 확인하고 필요한 운영 작업을 수행합니다.</p></div></div>
<section class="list-card"><div th:if="${users.content.empty}" class="empty-state">표시할 사용자가 없습니다.</div><article class="list-row" th:each="user : ${users.content}"><div><strong th:text="${user.nickname}">닉네임</strong><span th:text="${user.email}">email</span><small th:text="${user.status}">ACTIVE</small></div><div class="actions"><form method="post" th:action="@{'/admin/users/' + ${user.email} + '/block'}"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button type="submit">차단</button></form><form method="post" th:action="@{'/admin/users/' + ${user.email} + '/force-logout'}"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button type="submit">강제 로그아웃</button></form></div></article></section>
<div class="pager"><a th:if="${pageNumber > 0}" th:href="@{'/admin/users?page=' + ${pageNumber - 1}}">이전</a><a th:href="@{'/admin/users?page=' + ${pageNumber + 1}}">다음</a></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></body></html>
