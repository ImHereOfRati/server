events {
    worker_connections 1024;
}

http {
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;

    log_format main escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"client.address":"$remote_addr",'
        '"http.request.method":"$request_method",'
        '"url.path":"$uri",'
        '"url.query":"$args",'
        '"http.response.status_code":$status,'
        '"http.response.body.size":$body_bytes_sent,'
        '"http.request.duration":$request_time,'
        '"nginx.upstream.status":"$upstream_status",'
        '"nginx.upstream.response_time":"$upstream_response_time",'
        '"nginx.upstream.connect_time":"$upstream_connect_time",'
        '"http.request.protocol":"$server_protocol",'
        '"user_agent.original":"$http_user_agent",'
        '"http.request.header.referer":"$http_referer",'
        '"server.address":"$host"'
        '}';

    access_log /var/log/nginx/access.log main;

    # 부하테스트에서는 애플리케이션 처리량을 측정하기 위해 요청률·연결 제한을 두지 않는다.
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    server {
        listen 80;
        server_name _;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location / {
            proxy_pass http://iamhere-server-container:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/loadtest/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/loadtest/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location / {
            proxy_pass http://iamhere-server-container:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
