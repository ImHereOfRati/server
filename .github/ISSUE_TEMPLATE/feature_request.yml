name: 기능 (Feature)
description: 사용자 문제를 해결하는 새로운 기능이나 개선을 제안합니다.
title: "[Feature] "
labels:
  - feat
assignees:
  - kdongsu5509
body:
  - type: markdown
    attributes:
      value: |
        구현 방법보다 누구의 어떤 문제를 해결하고, 어떤 결과가 필요하며, 언제 완료되는지가 중요합니다.

  - type: dropdown
    id: scopes
    attributes:
      label: 영향 영역
      description: 기능이 필요한 영역을 모두 선택해 주세요.
      multiple: true
      options:
        - API
        - 도메인 로직
        - 데이터베이스 또는 마이그레이션
        - 외부 연동
        - 인프라 또는 배포
        - 영역 공통 또는 무관
    validations:
      required: true

  - type: textarea
    id: target-users
    attributes:
      label: 대상 사용자
      description: 이 기능을 누가 어떤 상황에서 사용하는지 작성해 주세요.
      placeholder: 예) 친구의 도착 알림을 실시간으로 받아야 하는 모바일 클라이언트
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 제약이 있으며 왜 해결해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: desired-result
    attributes:
      label: 원하는 결과
      description: 기능이 제공해야 하는 동작이나 API 계약을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 구체적인 엔드포인트, 도메인 흐름 또는 구현 아이디어가 있을 때만 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: completion-criteria
    attributes:
      label: 완료 조건
      description: 기능이 완료되었다고 판단할 수 있는 확인 가능한 결과를 작성해 주세요.
      placeholder: |
        - [ ] 클라이언트가 ...
        - [ ] 실패한 경우 ...
        - [ ] 관련 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 자료
      description: 참고 문서, API 명세, 관련 이슈 또는 PR이 있다면 연결해 주세요.
    validations:
      required: false
