# Unified compose
# - local profile: app + Prometheus + Grafana
# - prod profile: dsko + nginx + alloy

services:
  app:
    image: iamhere:latest
    container_name: iamhere-server-container
    profiles:
      - local
    ports:
      - "${APP_HTTP_PORT:-80}:8080"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-rati}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
    networks:
      - app-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-container
    profiles:
      - local
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-container
    profiles:
      - local
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    environment:
      - TZ=Asia/Seoul
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-network
    restart: unless-stopped

  dsko:
    image: ${ECR_REGISTRY:-local}/${ECR_REPOSITORY:-imhere-server}:latest
    container_name: iamhere-server-container
    profiles:
      - prod
    # 세 컨테이너 상한 합이 호스트 가용 메모리를 넘지 않게 잡는다.
    # t3.small(2 GiB) - 호스트 OS/dockerd(~350 MiB) = 약 1.65 GiB가 쓸 수 있는 몫이고
    # 1200m + 200m + 64m = 1.43 GiB로 그 안에 들어간다. 상한을 오버서브스크립션하면
    # JVM이 자기 cgroup 한도까지 자라는 게 정당한데도 호스트 커널이 OOM kill 한다.
    mem_limit: 1200m
    pull_policy: always
    labels:
      - "imhere_log_scope=external"
    # 관심사별로 쪼갠 런타임 env. 컨테이너마다 필요한 파일만 붙인다 —
    # 앱에는 Grafana Cloud 키가, alloy에는 DB 비밀번호가 보이지 않게 하려는 것이다.
    # 구조와 키 목록은 private config repo의 env/ 파일을 참고.
    env_file:
      - ./env/app.env
      - ./env/web.env
      - ./env/oidc.env
      - ./env/external.env
    environment:
      - TZ=Asia/Seoul
    expose:
      - "8080"
      - "4861"
    volumes:
      - ./secrets/imhereFirebaseKey.json:/app/secrets/imhereFirebaseKey.json:ro
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    profiles:
      - prod
    mem_limit: 64m
    labels:
      - "imhere_log_scope=internal"
    ports:
      - "80:80"
      - "443:443"
    # nginx.conf는 CI에서 값이 치환된 상태로 들어온다. 이 env_file은 설정
    # 렌더링용이 아니라 컨테이너 안에서 도메인 값을 확인하기 위한 것이다.
    env_file:
      - ./env/web.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - dsko

  alloy:
    image: grafana/alloy:latest
    container_name: alloy-container
    profiles:
      - prod
    mem_limit: 200m
    labels:
      - "imhere_log_scope=internal"
    env_file:
      - ./env/observability.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/alloy/alloy-config.alloy:/etc/alloy/config.alloy:ro
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    networks:
      - app-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
networks:
  app-network:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
