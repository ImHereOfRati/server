<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>약관 관리</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<header th:replace="~{admin/fragments :: header('terms')}"></header><main class="admin-main"><div class="page-heading"><div><div class="eyebrow">ADMIN · TERMS</div><h1>약관 관리</h1></div></div><section class="split-grid"><div class="list-card"><article class="list-row" th:each="term : ${terms}"><div><strong th:text="${term.title}">약관</strong><span th:text="${term.type + ' · v' + term.version}">SERVICE</span><small th:text="${term.effectiveDate}">적용일</small></div></article></div><form method="post" action="/admin/terms" class="form-card"><h2>새 약관 등록</h2><input type="hidden" name="_csrf" th:value="${_csrf.token}"><label>유형<select name="type"><option value="SERVICE">SERVICE</option><option value="PRIVACY">PRIVACY</option><option value="LOCATION">LOCATION</option><option value="MARKETING">MARKETING</option></select></label><label>제목<input name="title" required></label><label>내용<textarea name="content" rows="7" required></textarea></label><label>적용일시<input name="effectiveDate" type="datetime-local" required></label><label class="check"><input name="isRequired" type="checkbox"> 필수 약관</label><button class="primary-button" type="submit">등록</button></form></section></main><footer th:replace="~{admin/fragments :: footer}"></footer></body></html>
