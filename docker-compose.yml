services:
  dsko:
    image: ${ECR_REGISTRY:-local}/${ECR_REPOSITORY:-imhere-server}:latest
    container_name: iamhere-server-container
    mem_limit: 1200m
    pull_policy: always
    labels:
      - "imhere_log_scope=external"
    env_file:
      - path: ./env/server.env
        required: false
    environment:
      - TZ=Asia/Seoul
    expose:
      - "8080"
      - "4861"
    volumes:
      - ./secrets/imhereFirebaseKey.json:/app/secrets/imhereFirebaseKey.json:ro
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    profiles:
      - prod
    mem_limit: 64m
    labels:
      - "imhere_log_scope=external"
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./env/nginx.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - dsko

  alloy:
    image: grafana/alloy:latest
    container_name: alloy-container
    profiles:
      - prod
    mem_limit: 200m
    labels:
      - "imhere_log_scope=internal"
    env_file:
      - ./env/alloy.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/alloy/alloy-config.alloy:/etc/alloy/config.alloy:ro
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    networks:
      - app-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
