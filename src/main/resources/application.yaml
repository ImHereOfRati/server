server:
  forward-headers-strategy: native

spring:
  application:
    name: imhere

  # 모든 ${VAR}에 로컬 기본값을 달아 두었다. 프로파일 없이 `bootRun`만 해도 뜬다.
  # 운영은 SPRING_PROFILES_ACTIVE=prod로 아래 prod 문서를 켜고, 그 문서가 값이
  # 반드시 주입돼야 하는 항목을 기본값 없이 다시 선언한다.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rati}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      idle-timeout: 600000
      # DB 커넥션 고갈 시 Nginx의 proxy_read_timeout(30s)보다 먼저 앱이 실패하도록 한다.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: 110000
      keepalive-time: 30000
      connection-test-query: "SELECT 1"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelToUnderscoresNamingStrategy

  batch:
    job:
      enabled: false

  modulith:
    events:
      completion-mode: delete
      republish-outstanding-events-on-restart: true

logging:
  file:
    name: ${LOG_FILE:logs/imhere.log}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name:},%X{traceId:-},%X{spanId:-}] [%thread] %logger{40} - %message%n%exception"
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE:logs/imhere.log}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
  level:
    org.springframework.security: TRACE
    root: INFO
    com.kdongsu5509: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    com.google.firebase: WARN
    p6spy: WARN

loadtest:
  provider:
    delay-ms: ${LOADTEST_PROVIDER_DELAY_MS:0}
    failure-rate: ${LOADTEST_PROVIDER_FAILURE_RATE:0.0}
    failure-mode: ${LOADTEST_PROVIDER_FAILURE_MODE:RETRYABLE}

management:
  server:
    port: 4861
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.security.http.secured.requests: true
  endpoints:
    web:
      # 운영에서는 난독화된 경로가 주입된다. prod 문서가 기본값 없이 다시 선언하므로
      # 이 기본값이 운영에 새어 나갈 일은 없다.
      base-path: ${MGMT_BASE_PATH:/actuator}
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          # Local default: send traces to an OTLP HTTP receiver on localhost.
          # Production overrides this endpoint in the prod profile document below.
          endpoint: http://localhost:4318/v1/traces
          transport: http
  tracing:
    sampling:
      probability: 0.1
    baggage:
      enabled: true

# 기본값은 로컬 전용 더미다. HS256이 요구하는 256비트를 넘겨야 해서 길이가 길다.
jwt:
  secret: ${JWT_SECRET:localDevSecretKeyForJwtAuthenticationOnly12345678901234567890}
  access-expiration-minutes: 720
  refresh-expiration-days: 7
  access-header-name: Authorization
  admin-expiration-minutes: ${JWT_ADMIN_EXPIRATION_MINUTES:15}

# issuers/audiences는 목록이다. Google은 iss를 스킴 포함/미포함 두 형태로 발급하고,
# Google·Apple은 iOS/Android/Web마다 client ID(aud)가 갈리기 때문이다.
# 값이 빈 항목은 OIDCProperties가 걸러내므로, 쓰지 않는 플랫폼은 env를 비워 두면 된다.
oidc:
  providers:
    kakao:
      issuers:
        - "https://kauth.kakao.com"
      audiences:
        - ${KAKAO_CLIENT_ID:}
      cacheKey: "kakaoOidcKeys::kakaoPublicKeySet"
      jwksUri: "https://kauth.kakao.com/.well-known/jwks.json"
    google:
      issuers:
        - "https://accounts.google.com"
        - "accounts.google.com"
      audiences:
        - ${GOOGLE_CLIENT_ID_WEB:}
        - ${GOOGLE_CLIENT_ID_IOS:}
        - ${GOOGLE_CLIENT_ID_ANDROID:}
      cacheKey: "googleOidcKeys::googlePublicKeySet"
      jwksUri: "https://www.googleapis.com/oauth2/v3/certs"
    apple:
      issuers:
        - "https://appleid.apple.com"
      audiences:
        # iOS는 bundle ID, 웹은 Services ID가 aud로 들어온다.
        - ${APPLE_CLIENT_ID:}
        - ${APPLE_SERVICE_ID:}
      cacheKey: "appleOidcKeys::applePublicKeySet"
      jwksUri: "https://appleid.apple.com/auth/keys"

# 외부 연동 자격증명. 로컬 기본값은 실제로 통하지 않는 더미다 — 기동은 되고
# 해당 기능을 실제로 호출할 때만 실패한다. FIREBASE_PATH는 운영에서 deploy-app이
# 복사해 둔 JSON 키를 가리킨다.
solapi:
  sender: ${SOLAPI_SENDER:01012341234}
  apiKey: ${SOLAPI_API_KEY:local-solapi-key}
  apiSecret: ${SOLAPI_API_SECRET:local-solapi-secret}

firebase:
  path: ${FIREBASE_PATH:file:src/test/resources/dummy-firebase-key.json}

# NCP Maps(지오코딩/역지오코딩)와 Naver 검색 API 자격증명.
naver:
  map:
    client-id: ${NAVER_MAP_CLIENT_ID:local-naver-map-client-id}
    client-secret: ${NAVER_MAP_CLIENT_SECRET:local-naver-map-client-secret}
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:local-naver-search-client-id}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:local-naver-search-client-secret}

discord:
  url:
    error:
      server: ${DISCORD_WEBHOOK_ERROR_SERVER:http://localhost}
      client: ${DISCORD_WEBHOOK_ERROR_CLIENT:http://localhost}

security:
  whitelist: ${SECURITY_WHITELIST:/api/auth,/api/auth/refresh,/api/terms,/swagger-ui/**,/docs/**}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

admin:
  id: ${ADMIN_ID:local-admin}
  nickname: rati
  mobile:
    password-hash: ${ADMIN_MOBILE_PASSWORD_HASH:}
    totp-secret: ${ADMIN_MOBILE_TOTP_SECRET:}
    challenge-expiration-seconds: ${ADMIN_MOBILE_CHALLENGE_EXPIRATION_SECONDS:300}
    refresh-expiration-days: ${ADMIN_MOBILE_REFRESH_EXPIRATION_DAYS:7}

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 아래는 기본 문서와 같은 키를 기본값 없이 다시 선언한 것이다. 기본값은 프로파일과
# 무관하게 적용되므로, 이렇게 덮어쓰지 않으면 env가 하나 빠졌을 때 운영이 로컬 더미로
# 조용히 뜬다 — JWT 서명키가 리포에 공개된 값이 되거나, 난독화해 둔 actuator 경로가
# /actuator로 노출되는 식이다. 여기 적힌 키가 하나라도 비면 기동 단계에서 실패한다.
#
# DB_*는 일부러 넣지 않았다. 값이 틀리면 Hikari 연결과 ddl-auto=validate가 기동
# 중에 터지므로 조용히 잘못될 수가 없다.
jwt:
  secret: ${JWT_SECRET}

solapi:
  sender: ${SOLAPI_SENDER}
  apiKey: ${SOLAPI_API_KEY}
  apiSecret: ${SOLAPI_API_SECRET}

firebase:
  path: ${FIREBASE_PATH}

naver:
  map:
    client-id: ${NAVER_MAP_CLIENT_ID}
    client-secret: ${NAVER_MAP_CLIENT_SECRET}
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET}

discord:
  url:
    error:
      server: ${DISCORD_WEBHOOK_ERROR_SERVER}
      client: ${DISCORD_WEBHOOK_ERROR_CLIENT}

security:
  whitelist: ${SECURITY_WHITELIST}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}

admin:
  id: ${ADMIN_ID}

management:
  endpoints:
    web:
      base-path: ${MGMT_BASE_PATH}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Production: send traces only to the alloy container on the same compose network.
          # Grafana Cloud credentials are handled by alloy, not by the app.
          endpoint: http://alloy-container:4318/v1/traces

logging:
  structured:
    format:
      console: ecs
  level:
    org.springframework.security: INFO
    p6spy: WARN
