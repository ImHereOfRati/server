<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: common-head('실패 알림 관리')}"></head>
<body>
<header th:replace="~{admin/layout :: common-header}"></header>

<main class="notion-container">
    <a href="/admin" class="back-to-dashboard">← 대시보드로 돌아가기</a>

    <div class="page-header">
        <h1 class="page-title">실패 알림 관리</h1>
        <p class="page-subtitle">재시도를 소진한 알림의 원인과 대상 정보를 확인하고 재발송하거나 폐기합니다.</p>
    </div>

    <div th:if="${message}" class="notion-alert success">
        <span class="sticker-dot green"></span>
        <span th:text="${message}"></span>
    </div>

    <div class="feature-card">
        <div class="table-responsive">
            <table class="notion-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>수신 대상</th>
                    <th>종류</th>
                    <th>수단</th>
                    <th>시도</th>
                    <th>실패 사유</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="notification : ${notifications}">
                    <td th:text="${notification.id}"></td>
                    <td th:text="${notification.targetIdentifier}"></td>
                    <td th:text="${notification.type}"></td>
                    <td th:text="${notification.method}"></td>
                    <td th:text="${notification.attempts}"></td>
                    <td th:text="${notification.lastError}"></td>
                    <td>
                        <form th:action="@{/admin/failed-notifications/{id}/redelivery-jobs(id=${notification.id})}"
                              method="post" style="display:inline">
                            <button type="submit">재발송</button>
                        </form>
                        <form th:action="@{/admin/failed-notifications/{id}/discard(id=${notification.id})}"
                              method="post" style="display:inline">
                            <button type="submit">폐기</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(notifications)}">
                    <td colspan="7">실패 알림이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
